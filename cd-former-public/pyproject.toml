[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cd-former"
version = "0.1.0"
description = "Unified framework for joint OD/OC segmentation with geometry-consistent vCDR estimation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "CD-Former Authors"}]
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0",
    "huggingface_hub>=0.20",
    "opencv-python-headless>=4.5",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "black>=24"]

[tool.setuptools.packages.find]
where = ["src"]
