# Hydra root config. Override on the command line, e.g.:
#   python scripts/train.py --config-name=experiment/repro_drishti training=spartan trainer.devices=4
defaults:
  - data: drishti_gs
  - model: rdcnn
  - training: single_gpu
  - _self_

seed: 42
project_name: glaucoma-rdcnn
run_name: ${now:%Y%m%d-%H%M%S}_${data.name}
output_dir: outputs/${run_name}

trainer:
  max_epochs: 60
  accumulate_grad_batches: 1
  precision: 16-mixed
  fast_dev_run: false
  log_every_n_steps: 20
  val_check_interval: 1.0
  gradient_clip_val: 1.0
  devices: 1

logging:
  tensorboard: true
  wandb: true
  wandb_project: glaucoma-rdcnn
  wandb_mode: offline   # set to "online" once you've `wandb login`-ed

ckpt:
  save_top_k: 3
  monitor: val/od_dice
  mode: max
  every_n_epochs: 1
