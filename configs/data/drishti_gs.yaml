name: drishti_gs
root: data/drishti_gs
image_dir: images
od_mask_dir: masks/od
oc_mask_dir: masks/oc
splits_file: splits/official.json   # produced by scripts/preprocess.py
image_size: 800        # paper uses 800x800 ROI crop
mean: [0.485, 0.456, 0.406]
std:  [0.229, 0.224, 0.225]
batch_size: 4
num_workers: 4
augment:
  hflip: 0.5
  vflip: 0.5
  rotation_choices: [0, 90, 180, 270]
clahe:
  clip_limit: 2.0
  tile_grid_size: [8, 8]
