# Spartan-tuned defaults — A100 80GB nodes have plenty of VRAM and 32 CPUs/node.
trainer:
  devices: 1               # overridden by sbatch / torchrun
  precision: 16-mixed
  strategy: ddp
  accumulate_grad_batches: 1
data:
  batch_size: 8            # A100-80GB can comfortably fit a larger batch at 800x800
  num_workers: 8           # half of the 32 CPUs per node — leave room for the OS
logging:
  wandb_mode: offline      # sync from your laptop after the run finishes
